; ControlEverything IR node firmware for the M5Stack Cardputer and Cardputer-Adv.
;
; Both envs build the same sources. The board is detected at runtime (M5GFX reads the
; G8/G9 pull-ups), so flashing the "wrong" env still works; the env only sets the
; fallback board used if detection ever fails and the name reported in `hello`.
;
;   pio run                               build both
;   pio run -e cardputer -t upload        original Cardputer
;   pio run -e cardputer-adv -t upload    Cardputer-Adv

[platformio]
default_envs = cardputer, cardputer-adv

[env]
; Arduino-ESP32 2.0.17, the same core as the user's other Cardputer projects.
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Keep DTR and RTS both asserted: on the S3 USB-Serial/JTAG port, RTS high with DTR low
; resets the chip and DTR high with RTS low arms download mode.
monitor_dtr = 1
monitor_rts = 1
upload_speed = 921600
lib_ldf_mode = chain
lib_deps =
    m5stack/M5GFX@0.2.27
    m5stack/M5Unified@0.2.20
    m5stack/M5Cardputer@1.1.1
    crankyoldgit/IRremoteESP8266@2.8.6
    bblanchon/ArduinoJson@7.4.3
; M5Cardputer lists Arduino-IRremote as a dependency, but its sources never include it.
; IR here is IRremoteESP8266 only, so keep the other library out of the build.
lib_ignore = IRremote
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; HWCDC: Serial is the S3's USB-Serial/JTAG port (VID 0x303A, PID 0x1001), so esptool
    ; can reset into download mode by itself and crash logs reach the host.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wno-unused-function

[env:cardputer]
build_flags = ${env.build_flags} -DCE_TARGET_ADV=0

[env:cardputer-adv]
build_flags = ${env.build_flags} -DCE_TARGET_ADV=1
