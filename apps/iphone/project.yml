# XcodeGen spec for the ControlEverything iPhone client.
# Regenerate the project after adding/removing files:  cd apps/iphone && xcodegen generate
name: ControlEverything
options:
  bundleIdPrefix: dev.controleverything
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  ControlEverything:
    type: application
    platform: iOS
    sources:
      - path: ControlEverything
        excludes:
          - "Info.plist"
    info:
      path: ControlEverything/Info.plist
      properties:
        CFBundleDisplayName: ControlEverything
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIRequiresPersistentWiFi: true
        UIAppFonts: []
        NSCameraUsageDescription: "Scan the server's QR code, approve your own devices by their QR, and send snapshots of your devices to your ControlEverything server."
        NSLocalNetworkUsageDescription: "ControlEverything talks to the server running on your Mac on this Wi-Fi network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.controleverything.ios
            CFBundleURLSchemes:
              - controleverything
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.controleverything.ios
        PRODUCT_NAME: ControlEverything
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  ControlEverythingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ControlEverythingUITests
    dependencies:
      - target: ControlEverything
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.controleverything.ios.uitests
        TEST_TARGET_NAME: ControlEverything
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGN_STYLE: Automatic
schemes:
  ControlEverything:
    build:
      targets:
        ControlEverything: all
    test:
      config: Debug
      targets:
        - ControlEverythingUITests
    run:
      config: Debug
    archive:
      config: Release
